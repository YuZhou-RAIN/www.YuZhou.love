<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>雨州 Minecraft 服务器</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon" sizes="16x16 32x32 48x48">
    <link rel="icon" href="images/favicon-260x260.png" type="image/png">
    <link rel="icon" href="images/雨州logo.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="images/favicon-260x260.png">
    <script>
        // GitHub Pages SPA 深由支持
        const path = window.location.pathname;
        const repo = '/www.yuzhou.love';
        
        let pagePath = path;
        if (path.startsWith(repo)) {
            pagePath = path.slice(repo.length);
        }
        
        pagePath = pagePath.replace(/^\//, '');
        
        if (pagePath && pagePath !== 'index.html') {
            sessionStorage.setItem('yuzhouRedirectPath', pagePath);
        }
        
        window.location.replace('/');
    </script>
</head>
<body>
</body>
</html>
