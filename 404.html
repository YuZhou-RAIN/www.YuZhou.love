<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>雨州Minecraft服务器</title>
    <script>
        // GitHub Pages SPA路由重定向逻辑
        (function() {
            // 获取当前路径
            var location = window.location;
            var pathname = location.pathname;
            
            // 检查是否为我们的应用路由
            var isAppRoute = pathname === '/' || 
                            pathname === '/features' || 
                            pathname === '/join' || 
                            pathname === '/about';
            
            // 如果是应用路由，则重定向到首页并保存路径
            if (isAppRoute) {
                // 保存路径到sessionStorage
                sessionStorage.setItem('githubPagesRedirectPath', pathname);
                // 重定向到首页
                location.replace('/');
            }
            // 如果是其他路径（真正的404），则显示404页面
        })();
    </script>
</head>
<body>
    <!-- 重定向到首页... -->
</body>
</html>
