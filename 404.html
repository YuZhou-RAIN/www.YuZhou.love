<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>雨州 Minecraft 服务器</title>
    <script>
        // GitHub Pages SPA 深由支持
        const path = window.location.pathname;
        const repo = '/www.yuzhou.love';
        
        let pagePath = path;
        if (path.startsWith(repo)) {
            pagePath = path.slice(repo.length);
        }
        
        pagePath = pagePath.replace(/^\//, '');
        
        if (pagePath && pagePath !== 'index.html') {
            sessionStorage.setItem('yuzhouRedirectPath', pagePath);
        }
        
        window.location.replace('/');
    </script>
</head>
<body>
</body>
</html>
