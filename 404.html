<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雨州 Minecraft</title>
</head>
<body>
    <script>
        // GitHub Pages SPA路由修复 - 轻量级实现
        (function() {
            // 解析当前URL路径
            const path = window.location.pathname;
            
            // 如果不是根路径且不以.js/.css/.png等静态资源结尾
            if (path !== '/' && !path.match(/\.(js|css|png|jpg|jpeg|gif|svg|ico|avif|webp)$/)) {
                console.log('404.html: 检测到非根路径访问:', path);
                
                // 清理路径，提取页面ID
                let pageId = path.replace(/^\//, '').replace(/\/$/, '');
                
                // 如果路径为空或不包含有效页面ID，默认为home
                if (!pageId || !['home', 'features', 'join', 'about'].includes(pageId)) {
                    pageId = 'home';
                }
                
                // 存储页面ID到sessionStorage，以便index.html使用
                sessionStorage.setItem('initialPageId', pageId);
                console.log('404.html: 存储初始化页面ID:', pageId);
                
                // 重定向到index.html
                window.location.href = '/';
            }
        })();
    </script>
</body>
</html>
    <script>
        // 复制按钮功能
        document.querySelectorAll('.copy-btn').forEach(button => {
            // 为每个按钮添加状态标志
            button.isCopying = false;
            
            button.addEventListener('click', function() {
                // 如果按钮正在显示"已复制"状态，则不处理重复点击
                if (this.isCopying) {
                    return;
                }
                
                const textToCopy = this.getAttribute('data-copy');
                navigator.clipboard.writeText(textToCopy).then(() => {
                    const originalText = this.innerHTML;
                    // 对于小按钮，只显示图标和文字
                    if (this.classList.contains('small')) {
                        this.innerHTML = '<i class="fas fa-check"></i> 已复制';
                    } else {
                        this.innerHTML = '<i class="fas fa-check"></i> 已复制';
                    }
                    
                    // 设置状态标志
                    this.isCopying = true;
                    
                    // 3秒后恢复原始文本
                    setTimeout(() => {
                        this.innerHTML = originalText;
                        this.isCopying = false;
                    }, 3000);
                }).catch(err => {
                    console.error('复制失败: ', err);
                    // 即使复制失败也要重置状态
                    this.isCopying = false;
                });
            });
        });

        // FAQ折叠功能
        document.addEventListener('DOMContentLoaded', function() {
            const faqQuestions = document.querySelectorAll('.faq-question');
            faqQuestions.forEach(question => {
                question.addEventListener('click', function() {
                    const answer = this.nextElementSibling;
                    const icon = this.querySelector('i');
                    
                    if (answer) {
                        // 如果答案已经展开，则收起
                        if (answer.classList.contains('active')) {
                            // 先设置为具体的高度
                            answer.style.maxHeight = answer.scrollHeight + 'px';
                            // 强制重排
                            answer.offsetHeight;
                            // 然后设置为0，触发动画
                            answer.style.maxHeight = '0';
                            answer.classList.remove('active');
                        } else {
                            // 展开答案
                            answer.classList.add('active');
                            // 设置为具体的高度
                            answer.style.maxHeight = answer.scrollHeight + 'px';
                        }
                        
                        // 旋转图标
                        if (icon) {
                            icon.classList.toggle('rotate');
                        }
                        
                        // 动画结束后清理样式
                        setTimeout(() => {
                            if (!answer.classList.contains('active')) {
                                answer.style.maxHeight = '';
                            }
                        }, 300);
                    }
                });
            });
        });

        // 表单提交处理
        document.addEventListener('DOMContentLoaded', function() {
            const feedbackForm = document.getElementById('feedbackForm');
            if (feedbackForm) {
                feedbackForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    
                    // 获取表单数据
                    const formData = new FormData(this);
                    const name = formData.get('nickname');
                    const email = formData.get('email');
                    const type = formData.get('type');
                    const message = formData.get('message');
                    
                    // 这里可以添加实际的表单提交逻辑
                    // 例如发送到服务器或使用第三方服务
                    
                    // 显示成功消息
                    const successMessage = document.createElement('div');
                    successMessage.className = 'success-message';
                    successMessage.innerHTML = `
                        <div class="success-content">
                            <i class="fas fa-check-circle"></i>
                            <h3>反馈提交成功！</h3>
                            <p>感谢您的反馈，我们会尽快处理并回复您。</p>
                        </div>
                    `;
                    
                    // 插入到表单前面
                    this.parentNode.insertBefore(successMessage, this);
                    
                    // 重置表单
                    this.reset();
                    
                    // 3秒后移除成功消息
                    setTimeout(() => {
                        if (successMessage.parentNode) {
                            successMessage.remove();
                        }
                    }, 3000);
                });
            }
        });
    </script>
</body>
</html>
