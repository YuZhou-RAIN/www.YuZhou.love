<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>雨州 Minecraft 服务器</title>
    <script>
        // GitHub Pages SPA 路由支持
        // 将路径信息保存到sessionStorage，然后重定向到首页
        const path = window.location.pathname;
        const repo = '/www.yuzhou.love'; // 你的仓库名
        
        // 提取页面路径（去掉仓库名）
        let pagePath = path;
        if (path.startsWith(repo)) {
            pagePath = path.slice(repo.length);
        }
        
        // 去掉开头的斜杠
        pagePath = pagePath.replace(/^\//, '');
        
        // 保存要加载的页面到sessionStorage
        if (pagePath && pagePath !== 'index.html') {
            sessionStorage.setItem('gh-pages-route', pagePath);
        }
        
        // 重定向到首页
        window.location.href = '/www.yuzhou.love/';
    </script>
</head>
<body>
    <p>正在跳转...</p>
</body>
</html>
