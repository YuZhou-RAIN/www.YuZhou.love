<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>雨州 Minecraft 服务器</title>
    <script>
        // GitHub Pages SPA 深由支持
        // 直接更新URL到路径，不重定向
        const path = window.location.pathname;
        const repo = '/www.yuzhou.love'; // 你的仓库名
        
        // 提取页面路径（去掉仓库名）
        let pagePath = path;
        if (path.startsWith(repo)) {
            pagePath = path.slice(repo.length);
        }
        
        // 去掉开头的斜杠
        pagePath = pagePath.replace(/^\//, '');
        
        // 如果不是首页，更新URL到完整路径
        if (pagePath && pagePath !== 'index.html') {
            window.history.replaceState({ page: pagePath }, '', `${repo}/${pagePath}`);
        }
    </script>
</head>
<body>
    <p>正在跳转...</p>
</body>
</html>
