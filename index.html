<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雨州 Minecraft</title>
    <link rel="icon" href="images/雨州logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/page.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="fonts/fontawesome-free-6.4.0-web/css/all.min.css">
</head>
<body>
    <!-- 加载界面 -->
    <div class="loading-screen active" id="loadingScreen">
        <div class="loading-container">
            <img src="images/雨州logo.svg" alt="" class="loading-logo">
        </div>
    </div>

    <!-- 侧边导航栏 -->
    <aside class="sidebar">
        <a href="/" class="nav-logo" data-page="home">
            <img src="images/雨州logo.svg" alt="雨州Minecraft" class="sidebar-logo">
        </a>
        
        <div class="sidebar-title">雨州 Minecraft</div>
        
        <nav class="sidebar-nav" id="sidebarNav">
            <a href="/" class="sidebar-link active" data-page="home" title="首页">
                <i class="fas fa-home"></i>
                <span class="nav-label">首页</span>
            </a>
            <a href="/features" class="sidebar-link" data-page="features" title="特色">
                <i class="fas fa-star"></i>
                <span class="nav-label">特色</span>
            </a>
            <a href="/join" class="sidebar-link" data-page="join" title="加入">
                <i class="fas fa-gamepad"></i>
                <span class="nav-label">加入</span>
            </a>
            <a href="/about" class="sidebar-link" data-page="about" title="关于">
                <i class="fas fa-info-circle"></i>
                <span class="nav-label">关于</span>
            </a>
        </nav>
        
        <div class="sidebar-action">
            <button class="sidebar-btn" id="themeToggle" title="跟随系统">
                <i class="fas fa-circle-half-stroke"></i>
            </button>
            <button class="sidebar-btn" onclick="copyIP()" title="复制服务器IP">
                <i class="fas fa-copy"></i>
            </button>
            <button class="sidebar-btn sidebar-hamburger" id="menuToggle" title="菜单">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </aside>

    <!-- 顶部栏 -->
    <header class="topbar">
        <div class="topbar-title">雨州 Minecraft</div>
    </header>

    <!-- 主内容区 -->
    <main class="main-content" id="mainContent">
        <!-- 页面内容将通过JS加载 -->
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div>&copy; 2025 雨州 Minecraft 服务器</div>
        <div class="footer-links">
            <a href="/" data-page="home">首页</a>
            <a href="/features" data-page="features">特色</a>
            <a href="/join" data-page="join">加入</a>
            <a href="/about" data-page="about">关于</a>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
