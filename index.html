<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雨州 Minecraft</title>
    <link rel="icon" href="images/雨州logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.min.css">
    <link rel="stylesheet" href="fonts/fontawesome-free-6.4.0-web/css/all.min.css">
</head>
<body>
    <!-- 加载指示器 -->
    <div class="loading-indicator" id="loadingIndicator">
        <div class="loading-content">
            <img src="images/loading.avif" alt="Loading" class="loading-logo">
            <h2 class="loading-title">雨州 Minecraft 服务器</h2>
            <p class="loading-subtitle">正在加载资源...</p>
            
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText">0%</div>
            </div>
            
            <div class="loading-stats">
                <div class="stat-item">
                    <div class="stat-label">已加载资源</div>
                    <div class="stat-value" id="resourceCount">0/0</div>
                </div>
            </div>
            
            <button id="skip-loading-btn" class="btn btn-secondary" style="display: none;">
                不等了，先看文字
            </button>
        </div>
    </div>

    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="fas fa-cube"></i>
                <span>雨州 Minecraft</span>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="/" class="nav-link active" data-page="home">首页</a>
                </li>
                <li class="nav-item">
                    <a href="/features" class="nav-link" data-page="features">特色</a>
                </li>
                <li class="nav-item">
                    <a href="/join" class="nav-link" data-page="join">加入</a>
                </li>
                <li class="nav-item">
                    <a href="/about" class="nav-link" data-page="about">关于</a>
                </li>
            </ul>
            <div class="hamburger">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
        </div>
    </nav>

    <!-- 页面切换过渡层 -->
    <div class="page-transition" id="pageTransition"></div>

    <main id="main-content">
        <!-- 页面内容将通过JavaScript动态加载 -->
    </main>

    <!-- 页脚 -->
    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h3>雨州 Minecraft</h3>
                <p>致力于提供稳定、有趣的游戏体验</p>
                <p>服务器地址: <strong>mc.yuzhou.love</strong> <button class="copy-btn small" data-copy="mc.yuzhou.love"><i class="fas fa-copy"></i></button></p>
            </div>
            <div class="footer-section">
                <h3>联系我们</h3>
                <p>QQ交流群: <strong>823557774</strong> <button class="copy-btn small" data-copy="823557774"><i class="fas fa-copy"></i></button></p>
                <p>网站: www.yuzhou.love</p>
            </div>
            <div class="footer-section">
                <h3>快速链接</h3>
                <ul>
                    <li><a href="/">首页</a></li>
                    <li><a href="/features">特色</a></li>
                    <li><a href="/join">加入指南</a></li>
                    <li><a href="/about">关于我们</a></li>
                </ul>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2025 雨州 Minecraft 服务器 保留所有权利. | 版本: 1.20.1</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
