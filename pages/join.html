<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/page.css">
<div id="join-content" class="page-content">
    <section class="page-hero">
        <div class="page-hero-content">
            <div class="page-hero-tag" data-i18n="join.page.tag">JOIN US</div>
            <h1 class="page-hero-title" data-i18n="join.page.title">加入指南</h1>
            <p class="page-hero-desc" data-i18n="join.page.desc">简单几步，开启你的冒险之旅</p>
        </div>
    </section>

    <section class="page-section">
        <h2 class="section-title-sm" data-i18n="join.section1.title">Java版加入</h2>
        <div class="join-layout">
            <div class="steps-grid">
                <div class="step-card">
                    <div class="step-number">1</div>
                    <h3 data-i18n="join.step1.1.title">启动游戏</h3>
                    <p data-i18n="join.step1.1.desc">打开Minecraft Java版客户端，确保版本兼容</p>
                </div>
                <div class="step-card">
                    <div class="step-number">2</div>
                    <h3 data-i18n="join.step1.2.title">多人游戏</h3>
                    <p data-i18n="join.step1.2.desc">点击主菜单的"多人游戏"选项</p>
                </div>
                <div class="step-card">
                    <div class="step-number">3</div>
                    <h3 data-i18n="join.step1.3.title">添加服务器</h3>
                    <p data-i18n="join.step1.3.desc">点击"添加服务器"，输入地址：mc.yzmc.top</p>
                </div>
            </div>
            <div class="join-image">
                <img src="../images/Java版加入指南.png" alt="Java版加入指南">
            </div>
        </div>
    </section>

    <section class="page-section alt-bg">
        <h2 class="section-title-sm" data-i18n="join.section2.title">基岩版加入</h2>
        <div class="join-layout join-layout-reverse">
            <div class="steps-grid">
                <div class="step-card">
                    <div class="step-number">1</div>
                    <h3 data-i18n="join.step2.1.title">打开游戏</h3>
                    <p data-i18n="join.step2.1.desc">启动Minecraft基岩版（手机/主机/Windows）</p>
                </div>
                <div class="step-card">
                    <div class="step-number">2</div>
                    <h3 data-i18n="join.step2.2.title">进入服务器</h3>
                    <p data-i18n="join.step2.2.desc">点击"游玩"→"服务器"→"添加服务器"</p>
                </div>
                <div class="step-card">
                    <div class="step-number">3</div>
                    <h3 data-i18n="join.step2.3.title">填写信息</h3>
                    <p data-i18n="join.step2.3.desc">地址：mc.yzmc.top，端口：19132</p>
                </div>
            </div>
            <div class="join-image">
                <img src="../images/基岩版加入指南.png" alt="基岩版加入指南">
            </div>
        </div>
    </section>
</div>
