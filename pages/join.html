<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/page.css">
<div id="join-content" class="page-content">
    <section class="page-hero">
        <div class="page-hero-content">
            <div class="page-hero-tag">JOIN US</div>
            <h1 class="page-hero-title">加入指南</h1>
            <p class="page-hero-desc">简单几步，开启你的冒险之旅</p>
        </div>
    </section>

    <section class="page-section">
        <h2 class="section-title-sm">Java版加入</h2>
        <div class="steps-grid">
            <div class="step-card">
                <div class="step-number">1</div>
                <h3>启动游戏</h3>
                <p>打开Minecraft Java版客户端，确保版本兼容</p>
            </div>
            <div class="step-card">
                <div class="step-number">2</div>
                <h3>多人游戏</h3>
                <p>点击主菜单的"多人游戏"选项</p>
            </div>
            <div class="step-card">
                <div class="step-number">3</div>
                <h3>添加服务器</h3>
                <p>点击"添加服务器"，输入地址：mc.yuzhou.love</p>
            </div>
        </div>
    </section>

    <section class="page-section alt-bg">
        <h2 class="section-title-sm">基岩版加入</h2>
        <div class="steps-grid">
            <div class="step-card">
                <div class="step-number">1</div>
                <h3>打开游戏</h3>
                <p>启动Minecraft基岩版（手机/主机/Windows）</p>
            </div>
            <div class="step-card">
                <div class="step-number">2</div>
                <h3>进入服务器</h3>
                <p>点击"游玩"→"服务器"→"添加服务器"</p>
            </div>
            <div class="step-card">
                <div class="step-number">3</div>
                <h3>填写信息</h3>
                <p>地址：mc.yuzhou.love，端口：19132</p>
            </div>
        </div>
    </section>
</div>
