<link rel="stylesheet" href="../css/common.css">

<div id="about-content" class="page-content">
    <section class="page-hero">
        <div class="page-hero-content">
            <div class="page-hero-tag" data-i18n="about.page.tag">ABOUT</div>
            <h1 class="page-hero-title" data-i18n="about.page.title">关于我们</h1>
            <p class="page-hero-desc" data-i18n="about.page.desc">联系我们，加入社区</p>

    <section class="page-section">

                <div class="contact-icon">
                    <i class="fas fa-server"></i>

                <div class="value">mc.yuzhou-mc.cn</div>

                <div class="contact-icon">
                    <i class="fab fa-qq"></i>
                </div>

                <div class="value">823557774</div>
                <button class="btn btn-primary" onclick="copyQQ()">
                    <i class="fas fa-copy"></i> <span data-i18n="about.card2.btn">复制群号</span>
                </button>
